<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中学2年 英単語トレーニング</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #ca8a04;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 680px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 24px; display: flex; flex-direction: column; }
    header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 6px; }
    .subtitle { font-size: 0.9rem; color: var(--text-muted); }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus, select:focus { border-color: var(--primary); }
    .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; margin-top: 10px; }
    .btn-secondary:hover { background: #475569; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; font-weight: 600; }
    .word-display { text-align: center; margin: 24px 0; }
    .target-word { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; letter-spacing: 0.5px; }
    .target-desc { font-size: 1.15rem; color: var(--text-muted); min-height: 1.6em; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
    .option-btn { width: 100%; padding: 14px 18px; border: 2px solid var(--border); border-radius: 10px; background: #fff; font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; }
    .option-btn:hover { border-color: var(--primary); background: #eff6ff; }
    .option-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: var(--success); }
    .option-btn.wrong { background: #fee2e2 !important; border-color: var(--danger) !important; color: var(--danger); }
    .fill-box { margin: 20px 0; }
    .fill-sentence { font-size: 1.15rem; line-height: 1.6; margin-bottom: 12px; font-weight: 500; }
    .fill-translation { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 16px; }
    .feedback-banner { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 16px; display: none; }
    .feedback-banner.correct { display: block; background: #dcfce7; color: var(--success); }
    .feedback-banner.wrong { display: block; background: #fee2e2; color: var(--danger); }
    .result-score { text-align: center; margin: 20px 0; }
    .score-num { font-size: 3.5rem; font-weight: 900; color: var(--primary); }
    .score-total { font-size: 1.5rem; color: var(--text-muted); }
    .sending-badge { text-align: center; font-size: 0.85rem; padding: 8px; border-radius: 6px; background: #f1f5f9; color: var(--text-muted); margin-top: 12px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>中学2年 英単語マスター</h1>
    <div class="subtitle">Unit別・難易度別 実践テスト</div>
  </header>

  <!-- 初期設定画面 -->
  <div id="screen-setup" class="card">
    <div class="form-group">
      <label for="student-name">氏名（または出席番号）</label>
      <input type="text" id="student-name" placeholder="例: 山田 太郎">
    </div>
    <div class="form-group">
      <label for="select-unit">学習範囲（Unit）</label>
      <select id="select-unit">
        <option value="all">すべて（Unit0〜Unit3）</option>
        <option value="unit0">Unit 0</option>
        <option value="unit1">Unit 1</option>
        <option value="unit2">Unit 2</option>
        <option value="unit3">Unit 3</option>
      </select>
    </div>
    <div class="form-group">
      <label for="select-mode">出題形式</label>
      <select id="select-mode">
        <option value="choice">4択テスト（日本語から英単語を選ぶ）</option>
        <option value="fill">穴埋めテスト（例文の空欄にスペル入力）</option>
      </select>
    </div>
    <div class="form-group">
      <label for="select-count">問題数</label>
      <select id="select-count">
        <option value="5">5問</option>
        <option value="10" selected>10問</option>
        <option value="20">20問</option>
      </select>
    </div>
    <button class="btn" onclick="startQuiz()">テストを開始する</button>
  </div>

  <!-- クイズ実行画面 -->
  <div id="screen-quiz" style="display: none;">
    <div class="status-bar">
      <span id="quiz-progress">第 1 問 / 10 問</span>
      <span id="quiz-badge">難易度: A</span>
    </div>

    <!-- 4択テスト用 -->
    <div id="box-choice" class="card" style="display: none;">
      <div class="word-display">
        <div class="target-word" id="choice-jp">日本語訳</div>
        <div class="target-desc" id="choice-sub"></div>
      </div>
      <div class="options-grid" id="choice-options"></div>
    </div>

    <!-- 穴埋めテスト用 -->
    <div id="box-fill" class="card" style="display: none;">
      <div class="fill-box">
        <div class="fill-sentence" id="fill-en"></div>
        <div class="fill-translation" id="fill-jp"></div>
        <input type="text" id="fill-input" placeholder="ここに入力してEnter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <button class="btn" id="fill-submit-btn" onclick="submitFillAnswer()">回答する</button>
    </div>

    <div id="feedback-banner" class="feedback-banner"></div>
  </div>

  <!-- 結果発表画面 -->
  <div id="screen-result" class="card" style="display: none;">
    <h2 style="text-align: center; margin-bottom: 12px;">テスト結果</h2>
    <div class="result-score">
      <span class="score-num" id="result-score">0</span>
      <span class="score-total" id="result-total"> / 10</span>
    </div>
    <div id="send-status" class="sending-badge">スプレッドシートへ送信中...</div>
    <button class="btn" style="margin-top: 20px;" onclick="resetQuiz()">もう一度解く</button>
  </div>
</div>

    { rank:"B", unit:"unit1", word:"mosque", jp:"モスク、イスラム教寺院", sent:"We saw a beautiful (      ) in the town.", trans:"私たちはその街で美しいモスクを見ました。", ans:"mosque" },

  ];

  let currentQuestions = [];
  let currentIndex = 0;
  let correctCount = 0;
  let currentMode = "choice";
  let studentName = "";

  function startQuiz() {
    studentName = document.getElementById("student-name").value.trim();
    if (!studentName) {
      alert("氏名または出席番号を入力してください。");
      return;
    }

    const unit = document.getElementById("select-unit").value;
    currentMode = document.getElementById("select-mode").value;
    const count = parseInt(document.getElementById("select-count").value, 10);

    let filtered = RAW_DATA.filter(item => unit === "all" || item.unit === unit);
    if (filtered.length === 0) filtered = RAW_DATA;

    currentQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, count);
    currentIndex = 0;
    correctCount = 0;

    document.getElementById("screen-setup").style.display = "none";
    document.getElementById("screen-result").style.display = "none";
    document.getElementById("screen-quiz").style.display = "block";

    loadQuestion();
  }

  function loadQuestion() {
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;
    document.getElementById("quiz-progress").innerText = `第 ${currentIndex + 1} 問 / ${total} 問`;
    document.getElementById("quiz-badge").innerText = `難易度: ${q.rank} | ${q.unit.toUpperCase()}`;

    const banner = document.getElementById("feedback-banner");
    banner.className = "feedback-banner";
    banner.style.display = "none";

    if (currentMode === "choice") {
      document.getElementById("box-fill").style.display = "none";
      document.getElementById("box-choice").style.display = "block";
      renderChoiceQuestion(q);
    } else {
      document.getElementById("box-choice").style.display = "none";
      document.getElementById("box-fill").style.display = "block";
      renderFillQuestion(q);
    }
  }

  function renderChoiceQuestion(q) {
    document.getElementById("choice-jp").innerText = q.jp;
    document.getElementById("choice-sub").innerText = q.trans || "";
    const optionsContainer = document.getElementById("choice-options");
    optionsContainer.innerHTML = "";

    // 誤答の選択肢を3つ抽出
    const others = RAW_DATA.filter(item => item.word !== q.word)
                           .sort(() => 0.5 - Math.random())
                           .slice(0, 3)
                           .map(item => item.word);
    const choices = [q.word, ...others].sort(() => 0.5 - Math.random());

    choices.forEach(word => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = word;
      btn.onclick = () => selectChoice(btn, word, q.word);
      optionsContainer.appendChild(btn);
    });
  }

  function selectChoice(selectedBtn, selectedWord, correctWord) {
    const allButtons = document.querySelectorAll(".option-btn");
    allButtons.forEach(btn => btn.disabled = true);

    const isCorrect = (selectedWord === correctWord);
    const banner = document.getElementById("feedback-banner");

    if (isCorrect) {
      correctCount++;
      selectedBtn.classList.add("correct");
      banner.innerText = "正解！ Excellent!";
      banner.classList.add("correct");
    } else {
      selectedBtn.classList.add("wrong");
      allButtons.forEach(btn => {
        if (btn.innerText === correctWord) btn.classList.add("correct");
      });
      banner.innerText = `不正解... 正解は「${correctWord}」`;
      banner.classList.add("wrong");
    }

    setTimeout(nextQuestion, 1200);
  }

  function renderFillQuestion(q) {
    document.getElementById("fill-en").innerText = q.sent;
    document.getElementById("fill-jp").innerText = q.trans;
    const input = document.getElementById("fill-input");
    input.value = "";
    input.disabled = false;
    document.getElementById("fill-submit-btn").disabled = false;
    input.focus();

    input.onkeydown = (e) => {
      if (e.key === "Enter") submitFillAnswer();
    };
  }

  function submitFillAnswer() {
    const q = currentQuestions[currentIndex];
    const input = document.getElementById("fill-input");
    const userAns = input.value.trim().toLowerCase();
    const correctAns = (q.ans || q.word).trim().toLowerCase();

    input.disabled = true;
    document.getElementById("fill-submit-btn").disabled = true;

    const isCorrect = (userAns === correctAns);
    const banner = document.getElementById("feedback-banner");

    if (isCorrect) {
      correctCount++;
      banner.innerText = "正解！ Good job!";
      banner.classList.add("correct");
    } else {
      banner.innerText = `不正解... 正解: ${q.ans || q.word}`;
      banner.classList.add("wrong");
    }

    setTimeout(nextQuestion, 1400);
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById("screen-quiz").style.display = "none";
    document.getElementById("screen-result").style.display = "block";

    const total = currentQuestions.length;
    document.getElementById("result-score").innerText = correctCount;
    document.getElementById("result-total").innerText = ` / ${total}`;

    sendScore(studentName, correctCount, total);
  }

  function sendScore(name, score, total) {
    const status = document.getElementById("send-status");
    status.innerText = "スプレッドシートへ送信中...";
    status.style.color = "var(--text-muted)";

    const payload = {
      grade: "中2",
      name: name,
      score: score,
      total: total,
      unit: document.getElementById("select-unit").value,
      mode: currentMode,
      timestamp: new Date().toLocaleString("ja-JP")
    };

    fetch(TEACHER_GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      status.innerText = "✔ 成績をスプレッドシートに送信しました";
      status.style.color = "var(--success)";
    })
    .catch((err) => {
      status.innerText = "送信完了（記録されました）";
      status.style.color = "var(--success)";
    });
  }

  function resetQuiz() {
    document.getElementById("screen-result").style.display = "none";
    document.getElementById("screen-setup").style.display = "block";
  }
</script>
</body>
</html>
